<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body>
    <header class="header">
      <img
        src="./eisenhower-matrix.jpg"
        class="header__img"
        alt="Eisenhower Matrix scheme"
      />
      <a
        class="header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </header>
    <main class="todo">
      <section id="new-task-section">
        <h1 class="visually-hidden">Add new task</h1>
        <label for="new-task-input" class="new-task__label">Add Item</label>
        <div class="new-task__row">
          <input
            id="new-task-input"
            class="input new-task__input"
            type="text"
          />
          <button class="btn">Add</button>
        </div>
      </section>
      <section>
        <h2 class="todo__title">Todo</h2>
        <ul class="task__list" id="incompleted-tasks">
          <li class="task__item">
            <input type="checkbox" class="task__checkbox" />
            <label class="task__label task">Pay Bills</label>
            <input type="text" class="input task task__input" />
            <button class="btn edit__btn">Edit</button>
            <button class="btn delete__btn">
              <img
                src="./remove.svg"
                class="task__delete-img"
                alt="delete task"
              />
            </button>
          </li>
          <li class="task__item edit-mode">
            <input type="checkbox" class="task__checkbox" />
            <label class="edit-mode__label task">Go Shopping</label>
            <input
              type="text"
              value="Go Shopping"
              class="input task__input edit-mode__input"
            />
            <button class="btn edit__btn">Save</button>
            <button class="btn delete__btn">
              <img
                src="./remove.svg"
                class="task__delete-img"
                alt="delete task"
              />
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2 class="todo__title">Completed</h2>
        <ul class="task__list" id="completed-tasks">
          <li class="task__item">
            <input type="checkbox" checked />
            <label class="completed-task__label task">See the Doctor</label>
            <input type="text" class="input task" />
            <button class="btn edit__btn">Edit</button>
            <button class="btn delete__btn">
              <img
                src="./remove.svg"
                class="task__delete-img"
                alt="delete task"
              />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
