<!DOCTYPE html>
<html>
  <head><title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" >
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <div class="header">
      <img src="./eisenhower-matrix.jpg" class="header__img">
      <a class="header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="todo">
      <p id="new-task-section">
        <label for="new-task-input" class="new-task__label">Add Item</label>
        <div class="new-task__row">
          <input id="new-task-input" class="input new-task__input" type="text">
          <button class="btn">Add</button>
        </div>
      </p>
      <h3 class="todo__title">Todo</h3>
      <ul class="task__list" id="incompleted-tasks">
        <li class="task__item">
          <input type="checkbox" class="task__checkbox">
          <label class="task__label task">Pay Bills</label>
          <input type="text" class="input task task__input">
          <button class="btn edit__btn">Edit</button>
          <button class="btn delete__btn">
            <img src="./remove.svg" class="task__delete-img">
          </button>
        </li>
        <li class="edit-mode">
          <input type="checkbox" class="task__checkbox">
          <label class="edit-mode__label task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="input edit-mode__input task">
          <button class="btn edit__btn">Save</button>
          <button class="btn delete__btn">
            <img src="./remove.svg" class="task__delete-img">
          </button>
        </li>
      </ul>
      <h3 class="todo__title">Completed</h3>
      <ul class="task__list" id="completed-tasks">
        <li class="task__item">
          <input type="checkbox" checked>
          <label class="completed-task__label task">See the Doctor</label>
          <input type="text" class="input task">
          <button class="btn edit__btn">Edit</button>
          <button class="btn delete__btn" class="task__delete-img">
            <img src="./remove.svg" class="task__delete-img">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
